<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Circular Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14"/>
  <!-- Bangladeshi Taka Symbol ৳ -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif, 'SolaimanLipi', 'Kalpurush'" font-size="280" font-weight="bold" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">৳</text>
</svg>
